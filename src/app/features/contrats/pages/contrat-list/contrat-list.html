<div class="card">


<div class="card-header d-flex justify-content-between align-items-center">


<div>

<h4 class="mb-0">

Liste des contrats

</h4>


<small class="text-muted">

Gestion des contrats clients

</small>


</div>



<button
class="btn btn-primary"
(click)="openCreate()">


<i class="ti ti-plus"></i>

Ajouter Contrat


</button>


</div>




<div class="card-body">


<div class="table-responsive">


<table
class="table table-hover table-striped align-middle"
*ngIf="contrats.length>0">


<thead class="table-primary">


<tr>


<th>
Référence
</th>


<th>
Client
</th>


<th>
Date début
</th>


<th>
Date fin
</th>


<th>
Prestations
</th>


<th class="text-center">
Actions
</th>


</tr>


</thead>



<tbody>


<tr *ngFor="let contrat of contrats">


<td>

<strong>

{{contrat.reference}}

</strong>

</td>



<td>

{{contrat.client}}

</td>




<td>

{{contrat.dateDebut | date:'dd/MM/yyyy'}}

</td>




<td>

{{contrat.dateFin | date:'dd/MM/yyyy'}}

</td>




<td>

<span class="badge bg-blue-600">

{{contrat.shoppingLists.length}}

</span>

</td>




<td class="text-center">


<button
class="btn btn-info btn-sm"
(click)="openDetails(contrat)">


<i class="ti ti-eye"></i>

Détails


</button>

<button
class="btn btn-warning btn-sm me-2"
(click)="openEdit(contrat)">


<i class="ti ti-edit"></i>

Modifier

</button>

<button
class="btn btn-danger btn-sm"
(click)="delete(contrat.id)">


<i class="ti ti-trash"></i>

Supprimer


</button>



</td>



</tr>


</tbody>


</table>



<div
*ngIf="contrats.length===0"
class="text-center py-5">


<h5>

Aucun contrat trouvé

</h5>


</div>


</div>


</div>


</div>
