<div class="card">


<div class="card-header bg-blue-600 text-white d-flex justify-content-between align-items-center">


<h3 class="mb-0">

Ajouter des prestations

</h3>



<button

class="btn btn-light"

(click)="cancel()">


<i class="ti ti-arrow-left"></i>

Retour


</button>


</div>





<div class="card-body">



<div
*ngIf="loading"
class="text-center py-5">


<div class="spinner-border text-primary"></div>


<p class="mt-3">

Chargement prestations...

</p>


</div>





<div
class="row"
*ngIf="!loading">





<div

class="col-md-4 mb-3"

*ngFor="let p of prestations">



<div

class="card prestation-card"

[class.selected]="selected.includes(p.id)"

(click)="toggleSelection(p.id)">



<div class="card-body">



<div class="form-check">


<input

type="checkbox"

class="form-check-input"

[checked]="selected.includes(p.id)">


<label class="form-check-label">


<strong>

{{p.designation}}

</strong>


</label>


</div>




<hr>



<p>

<b>Code ERP :</b>

{{p.codeERP}}

</p>



<p>

<b>Prix :</b>

{{p.prix}} TND

</p>




</div>


</div>



</div>


</div>







<div class="text-end mt-4">


<button

class="btn btn-secondary me-2"

(click)="cancel()">



Annuler


</button>



<button

class="btn btn-success"

(click)="save()">



<i class="ti ti-plus"></i>


Ajouter


</button>


</div>



</div>


</div>
