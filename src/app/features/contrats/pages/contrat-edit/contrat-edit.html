<div class="card">


<div class="card-header bg-blue-600 text-white d-flex justify-content-between align-items-center">


<h3 class="mb-0">

<i class="ti ti-file-text me-2"></i>

Modifier Contrat

</h3>



<button
class="btn btn-light"
(click)="cancel()">


<i class="ti ti-x"></i>


</button>



</div>





<div
class="card-body"
*ngIf="loading">


<div class="text-center py-5">


<div class="spinner-border text-primary"></div>


<p class="mt-3">

Chargement contrat...

</p>


</div>


</div>






<div
class="card-body"
*ngIf="!loading">


<form
[formGroup]="form"
(ngSubmit)="update()">






<div class="row">





<div class="col-md-12 mb-3">


<label class="form-label fw-bold">

Référence contrat

</label>



<input

class="form-control"

formControlName="reference"

placeholder="Ex: CONT-2026-001">


</div>







<div class="col-md-6 mb-3">


<label class="form-label fw-bold">

Date début

</label>


<input

type="date"

class="form-control"

formControlName="dateDebut">


</div>








<div class="col-md-6 mb-3">


<label class="form-label fw-bold">

Date fin

</label>


<input

type="date"

class="form-control"

formControlName="dateFin">


</div>





</div>






<div class="text-end mt-4">


<button

type="button"

class="btn btn-secondary me-2"

(click)="cancel()">



<i class="ti ti-x"></i>

Annuler


</button>





<button

class="btn btn-warning"

type="submit">



<i class="ti ti-edit"></i>


Modifier


</button>



</div>





</form>



</div>



</div>
