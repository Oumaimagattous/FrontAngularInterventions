<div class="modal-header">

  <h4 class="modal-title">
    Ajouter un client
  </h4>

</div>


<div class="modal-body">

<form [formGroup]="clientForm" novalidate>


<div class="row">


  <!-- Matricule -->
  <div class="col-md-6">

    <div class="mb-3">

      <label class="form-label">
        Matricule Fiscal
      </label>

      <input
        class="form-control"
        type="text"
        formControlName="matricule"
        placeholder="Entrer le matricule">


      <div 
        class="text-danger"
        *ngIf="clientForm.get('matricule')?.touched 
        && clientForm.get('matricule')?.invalid">

        Matricule obligatoire

      </div>

    </div>

  </div>




  <!-- Raison Sociale -->
  <div class="col-md-6">

    <div class="mb-3">

      <label class="form-label">
        Raison Sociale
      </label>

      <input
        class="form-control"
        type="text"
        formControlName="raisonSociale"
        placeholder="Entrer la raison sociale">


      <div 
        class="text-danger"
        *ngIf="clientForm.get('raisonSociale')?.touched 
        && clientForm.get('raisonSociale')?.invalid">

        Raison Sociale obligatoire

      </div>

    </div>

  </div>




  <!-- Adresse -->
  <div class="col-md-6">

    <div class="mb-3">

      <label class="form-label">
        Adresse
      </label>

      <input
        class="form-control"
        type="text"
        formControlName="adresse"
        placeholder="Entrer l'adresse">

    </div>

  </div>




  <!-- Nom -->
  <div class="col-md-6">

    <div class="mb-3">

      <label class="form-label">
        Nom
      </label>

      <input
        class="form-control"
        type="text"
        formControlName="nom"
        placeholder="Entrer le nom">


      <div 
        class="text-danger"
        *ngIf="clientForm.get('nom')?.touched 
        && clientForm.get('nom')?.invalid">

        Nom obligatoire

      </div>

    </div>

  </div>




  <!-- Email -->
  <div class="col-md-6">

    <div class="mb-3">

      <label class="form-label">
        Email
      </label>

      <input
        class="form-control"
        type="email"
        formControlName="email"
        placeholder="Entrer l'email">


      <div 
        class="text-danger"
        *ngIf="clientForm.get('email')?.touched 
        && clientForm.get('email')?.invalid">

        Email invalide

      </div>

    </div>

  </div>




  <!-- Téléphone -->
  <div class="col-md-6">

    <div class="mb-3">

      <label class="form-label">
        Téléphone
      </label>

      <input
        class="form-control"
        type="text"
        formControlName="telephone"
        placeholder="Entrer le téléphone">

    </div>

  </div>


</div>


</form>


</div>



<div class="modal-footer">

  <button
    type="button"
    class="btn btn-secondary"
    (click)="close()">

    Annuler

  </button>



  <button
    type="button"
    class="btn btn-primary"
    [disabled]="clientForm.invalid"
    (click)="save()">

    Enregistrer

  </button>


</div>
