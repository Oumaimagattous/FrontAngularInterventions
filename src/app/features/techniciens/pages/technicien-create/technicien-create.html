<div class="modal-header bg-blue-600 text-white">

    <h4 class="mb-0">
        Ajouter un technicien
    </h4>

    <button
        class="btn-close btn-close-white"
        (click)="close()">
    </button>

</div>

<div class="modal-body">

    <div class="mb-3">

        <label class="form-label">
            Nom
        </label>

        <input
            class="form-control"
            [(ngModel)]="technicien.nom">

    </div>

    <div class="mb-3">

        <label class="form-label">
            Prénom
        </label>

        <input
            class="form-control"
            [(ngModel)]="technicien.prenom">

    </div>

    <div class="mb-3">

        <label class="form-label">
            Email
        </label>

        <input
            type="email"
            class="form-control"
            [(ngModel)]="technicien.email">

    </div>

    <div class="mb-3">

        <label class="form-label">
            Matricule
        </label>

        <input
            class="form-control"
            [(ngModel)]="technicien.matricule">

    </div>

    <div class="mb-3">

    <label class="form-label">
        Telephone
    </label>

    <input
        type="telephone"
        class="form-control"
        [(ngModel)]="technicien.telephone">

</div>

</div>

<div class="modal-footer">

    <button
        class="btn btn-secondary"
        (click)="close()">

        Annuler

    </button>

    <button
        class="btn btn-primary"
        (click)="save()"
        [disabled]="loading">

        <span
            *ngIf="loading"
            class="spinner-border spinner-border-sm me-2">
        </span>

        Enregistrer

    </button>

</div>
