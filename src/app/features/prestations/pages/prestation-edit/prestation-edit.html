<div class="card">

    <div class="card-header bg-blue-600 text-white d-flex justify-content-between align-items-center">

        <h3 class="mb-0">

            Modifier Prestation

        </h3>

        <button
            class="btn btn-light"
            (click)="cancel()">

            <i class="ti ti-arrow-left"></i>

            Retour

        </button>

    </div>

    <div
        class="card-body text-center"
        *ngIf="loading">

        <div class="spinner-border text-primary"></div>

        <p class="mt-3">

            Chargement...

        </p>

    </div>

    <div
        class="card-body"
        *ngIf="!loading">

        <form
            [formGroup]="form"
            (ngSubmit)="update()">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Code ERP

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        formControlName="codeERP">

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Prix

                    </label>

                    <input
                        type="number"
                        class="form-control"
                        formControlName="prix">

                </div>

                <div class="col-md-12 mb-3">

                    <label class="form-label">

                        Désignation

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        formControlName="designation">

                </div>

            </div>

            <hr>

            <div class="text-end">

                <button
                    type="button"
                    class="btn btn-secondary me-2"
                    (click)="cancel()">

                    <i class="ti ti-x"></i>

                    Annuler

                </button>

                <button
                    class="btn btn-warning"
                    [disabled]="saving">

                    <i class="ti ti-edit"></i>

                    Modifier

                </button>

            </div>

        </form>

    </div>

</div>
