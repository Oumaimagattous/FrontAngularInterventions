<div class="card">

  <div class="card-header bg-primary text-white">

    <h3 class="mb-0">
      Générer une moulinette
    </h3>

  </div>

  <div class="card-body">

    <form #form="ngForm" (ngSubmit)="save()">

      <div class="mb-3">

        <label class="form-label">
          Client
        </label>

        <select
          class="form-select"
          name="clientId"
          [(ngModel)]="moulinette.clientId"
          required>

          <option [ngValue]="0">
            -- Choisir un client --
          </option>

          <option
            *ngFor="let c of clients"
            [ngValue]="c.id">

            {{ c.raisonSociale }}

          </option>

        </select>

      </div>

      <div class="mb-3">

        <label class="form-label">
          Date début
        </label>

        <input
          type="date"
          class="form-control"
          name="periodeDebut"
          [(ngModel)]="moulinette.periodeDebut"
          required>

      </div>

      <div class="mb-3">

        <label class="form-label">
          Date fin
        </label>

        <input
          type="date"
          class="form-control"
          name="periodeFin"
          [(ngModel)]="moulinette.periodeFin"
          required>

      </div>

      <div class="d-flex gap-2">

        <button
          class="btn btn-success"
          type="submit"
          [disabled]="loading || !form.valid">

          <span
            *ngIf="loading"
            class="spinner-border spinner-border-sm me-2">
          </span>

          Générer

        </button>

        <button
          type="button"
          class="btn btn-secondary"
          (click)="cancel()">

          Annuler

        </button>

      </div>

    </form>

  </div>

</div>
